# DESARROLLO - Docker Compose para desarrollo con hot reload
# Uso: docker-compose -f docker-compose.dev.yml up

version: '3.8'

services:
  # PostgreSQL Database
  database:
    image: postgres:15-alpine
    container_name: blogv2_dev_database
    restart: unless-stopped
    environment:
      POSTGRES_DB: blogv2_dev
      POSTGRES_USER: blogv2_user
      POSTGRES_PASSWORD: blogv2_password
      POSTGRES_ROOT_PASSWORD: root_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - blogv2_dev_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: blogv2_dev_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis_password
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - blogv2_dev_network

  # Laravel Backend API - DESARROLLO (con hot reload)
  backend:
    image: php:8.2-cli
    container_name: blogv2_dev_backend
    restart: unless-stopped
    working_dir: /var/www/html
    command: >
      sh -c "
        apt-get update &&
        apt-get install -y libpq-dev libzip-dev zip unzip git curl &&
        docker-php-ext-configure pgsql -with-pgsql=/usr/local/pgsql &&
        docker-php-ext-install pdo pdo_pgsql pgsql zip &&
        pecl install redis && docker-php-ext-enable redis &&
        curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer &&
        if [ ! -f /var/www/html/composer.json ]; then
          echo 'Laravel no instalado aún, esperando...';
          sleep infinity;
        else
          composer install &&
          php artisan serve --host=0.0.0.0 --port=8000;
        fi
      "
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=database
      - DB_PORT=5432
      - DB_DATABASE=blogv2_dev
      - DB_USERNAME=blogv2_user
      - DB_PASSWORD=blogv2_password
      - REDIS_HOST=redis
      - REDIS_PASSWORD=redis_password
      - REDIS_PORT=6379
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - database
      - redis
    networks:
      - blogv2_dev_network

  # Nuxt 3 Frontend - DESARROLLO (con hot reload usando pnpm)
  frontend:
    image: node:18-alpine
    container_name: blogv2_dev_frontend
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "
        npm install -g pnpm &&
        if [ ! -f /app/package.json ]; then
          echo 'Nuxt no instalado aún, esperando...';
          sleep infinity;
        else
          pnpm install &&
          pnpm run dev;
        fi
      "
    environment:
      - NUXT_PUBLIC_API_BASE=http://localhost:8000/api
      - NODE_ENV=development
      - NUXT_HOST=0.0.0.0
      - NUXT_PORT=3000
    ports:
      - "3000:3000"
      - "24678:24678" # Puerto para hot reload
    volumes:
      - ./frontend:/app
      - pnpm_store:/root/.local/share/pnpm # Cache global de pnpm
      - /app/node_modules # Named volume para node_modules
    depends_on:
      - backend
    networks:
      - blogv2_dev_network

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  pnpm_store:
    driver: local

networks:
  blogv2_dev_network:
    driver: bridge