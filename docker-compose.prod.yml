# PRODUCCIÓN - Docker Compose para producción optimizada
# Uso: docker-compose -f docker-compose.prod.yml up -d

version: '3.8'

services:
  # PostgreSQL Database
  database:
    image: postgres:15-alpine
    container_name: blogv2_prod_database
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - blogv2_prod_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: blogv2_prod_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    networks:
      - blogv2_prod_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Laravel Backend API - PRODUCCIÓN (nginx + php-fpm)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: blogv2_prod_backend
    restart: always
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=database
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_PORT=6379
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL}
    ports:
      - "8000:80"
    volumes:
      - ./backend/storage:/var/www/html/storage
      - backend_logs:/var/www/html/storage/logs
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - blogv2_prod_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nuxt 3 Frontend - PRODUCCIÓN (static build + nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: blogv2_prod_frontend
    restart: always
    environment:
      - NUXT_PUBLIC_API_BASE=${FRONTEND_API_BASE}
      - NODE_ENV=production
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - blogv2_prod_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Laravel Queue Worker (for background jobs)
  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: blogv2_prod_queue
    restart: always
    command: php artisan queue:work --verbose --tries=3 --timeout=90 --sleep=3 --max-jobs=1000
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=database
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_PORT=6379
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY}
    volumes:
      - ./backend/storage:/var/www/html/storage
      - queue_logs:/var/www/html/storage/logs
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - blogv2_prod_network
    healthcheck:
      test: ["CMD", "php", "artisan", "queue:monitor", "default", "--max-wait-time=60"]
      interval: 60s
      timeout: 30s
      retries: 3

  # Laravel Scheduler (for cron jobs)
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: blogv2_prod_scheduler
    restart: always
    command: >
      sh -c "
        while true; do
          php artisan schedule:run --verbose --no-interaction &
          sleep 60
        done
      "
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=database
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_PORT=6379
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY}
    volumes:
      - ./backend/storage:/var/www/html/storage
      - scheduler_logs:/var/www/html/storage/logs
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - blogv2_prod_network

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  backend_logs:
    driver: local
  queue_logs:
    driver: local
  scheduler_logs:
    driver: local

networks:
  blogv2_prod_network:
    driver: bridge